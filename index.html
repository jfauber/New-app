<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>U-M GPA Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #00274C;
      --blue-mid: #00356B;
      --blue-light: #0A3F7A;
      --maize: #FFCB05;
      --maize-dark: #E6B800;
      --maize-dim: rgba(255, 203, 5, 0.12);
      --surface: #0d1c2e;
      --surface2: #112438;
      --surface3: #163050;
      --border: #1e3a54;
      --border2: #254a69;
      --text: #e8edf2;
      --text-muted: #7a9bb8;
      --radius: 10px;
      --a-plus: #22c55e;
      --b-color: #60a5fa;
      --c-color: #fbbf24;
      --d-color: #f97316;
      --e-color: #f87171;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--blue);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 48px;
    }

    /* Header */
    .header {
      background: var(--blue);
      border-bottom: 3px solid var(--maize);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-logo {
      font-size: 2rem;
      font-weight: 900;
      color: var(--maize);
      letter-spacing: -1px;
      line-height: 1;
    }

    .header-text h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
    }

    .header-text p {
      font-size: 0.78rem;
      color: var(--maize);
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 16px 0;
    }

    /* GPA Summary Cards */
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    .summary-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      text-align: center;
    }

    .summary-card.highlight {
      border-color: var(--maize);
      background: linear-gradient(135deg, var(--surface2) 0%, #1a3a00 100%);
      background: var(--maize-dim);
      border-color: var(--maize);
    }

    .summary-value {
      font-size: 2.4rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }

    .summary-card.highlight .summary-value { color: var(--maize); }

    .summary-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .gpa-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      margin-top: 6px;
    }

    /* Panels */
    .panel {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 20px;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--surface3);
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-wrap: wrap;
    }

    .panel-title {
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .semester-gpa-badge {
      background: var(--maize-dim);
      border: 1px solid var(--maize);
      color: var(--maize);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .panel-body { padding: 16px 18px; }

    /* Course row */
    .course-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }

    .course-row {
      display: grid;
      grid-template-columns: 1fr 80px 110px 36px;
      gap: 8px;
      align-items: center;
    }

    .course-row.header-row {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 7px;
      color: var(--text);
      font-size: 0.9rem;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    input:focus, select:focus { border-color: var(--maize); }
    input::placeholder { color: var(--text-muted); }
    select option { background: var(--surface); }

    .grade-select { font-weight: 600; }

    /* Grade coloring */
    .grade-A { color: var(--a-plus); }
    .grade-B { color: var(--b-color); }
    .grade-C { color: var(--c-color); }
    .grade-D { color: var(--d-color); }
    .grade-E { color: var(--e-color); }

    .btn {
      border: none;
      border-radius: 7px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s, opacity 0.15s;
      font-family: inherit;
      padding: 8px 16px;
    }

    .btn:active { transform: scale(0.96); }

    .btn-primary {
      background: var(--maize);
      color: var(--blue);
    }

    .btn-primary:hover { background: var(--maize-dark); }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border2);
    }

    .btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }

    .btn-icon {
      width: 36px;
      height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border2);
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn-icon:hover { background: rgba(248,113,113,0.15); color: #f87171; border-color: #f87171; }

    .add-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .add-row input { flex: 1; }

    /* Semester actions */
    .semester-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Add semester */
    .add-semester-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 14px 0 0;
    }

    .add-semester-bar input { max-width: 220px; }

    /* GPA Scale */
    .scale-panel {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .scale-toggle {
      width: 100%;
      background: var(--surface3);
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 12px 18px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: color 0.15s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .scale-toggle:hover { color: var(--text); }

    .scale-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      padding: 16px 18px;
    }

    .scale-item {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 7px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .scale-letter { font-weight: 700; }
    .scale-points { color: var(--text-muted); font-size: 0.8rem; }

    /* Empty state */
    .empty-courses {
      text-align: center;
      padding: 24px 0 8px;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    /* Semester delete */
    .btn-del-semester {
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 10px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn-del-semester:hover { background: rgba(248,113,113,0.15); color: #f87171; border-color: #f87171; }

    /* Credits input */
    .credits-input { text-align: center; }

    @media (max-width: 600px) {
      .summary { grid-template-columns: 1fr 1fr; }
      .course-row { grid-template-columns: 1fr 64px 95px 32px; gap: 6px; }
      .header-logo { font-size: 1.5rem; }
      .header-text h1 { font-size: 1.1rem; }
    }

    @media (max-width: 420px) {
      .course-row { grid-template-columns: 1fr 52px 85px 28px; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-logo">M</div>
  <div class="header-text">
    <h1>GPA Calculator</h1>
    <p>University of Michigan</p>
  </div>
</div>

<div class="content">

  <!-- Summary -->
  <div class="summary" id="summary">
    <div class="summary-card">
      <div class="summary-value" id="sum-credits">0</div>
      <div class="summary-label">Total Credits</div>
    </div>
    <div class="summary-card">
      <div class="summary-value" id="sum-courses">0</div>
      <div class="summary-label">Courses</div>
    </div>
    <div class="summary-card highlight">
      <div class="summary-value" id="sum-gpa">—</div>
      <div class="summary-label">Cumulative GPA</div>
      <div id="sum-standing" style="margin-top:4px;"></div>
    </div>
  </div>

  <!-- Semesters -->
  <div id="semesters-container"></div>

  <!-- Add semester -->
  <div class="add-semester-bar">
    <input type="text" id="new-sem-name" placeholder="Semester name (e.g. Fall 2024)" maxlength="40" />
    <button class="btn btn-primary" onclick="addSemester()">+ Add Semester</button>
  </div>

  <!-- GPA Scale Reference -->
  <div class="scale-panel" style="margin-top:24px;">
    <button class="scale-toggle" onclick="toggleScale()" id="scale-btn">
      <span>U-M Grading Scale Reference</span>
      <span id="scale-arrow">▼</span>
    </button>
    <div id="scale-body" style="display:none;">
      <div class="scale-grid" id="scale-grid"></div>
    </div>
  </div>

</div>

<script>
  const STORAGE_KEY = 'umich_gpa_v1';

  const GRADE_POINTS = [
    { grade: 'A+', points: 4.0 },
    { grade: 'A',  points: 4.0 },
    { grade: 'A-', points: 3.7 },
    { grade: 'B+', points: 3.3 },
    { grade: 'B',  points: 3.0 },
    { grade: 'B-', points: 2.7 },
    { grade: 'C+', points: 2.3 },
    { grade: 'C',  points: 2.0 },
    { grade: 'C-', points: 1.7 },
    { grade: 'D+', points: 1.3 },
    { grade: 'D',  points: 1.0 },
    { grade: 'D-', points: 0.7 },
    { grade: 'E',  points: 0.0 },
  ];

  const GRADE_MAP = Object.fromEntries(GRADE_POINTS.map(g => [g.grade, g.points]));

  function gradeColor(grade) {
    if (!grade) return '';
    if (grade.startsWith('A')) return 'grade-A';
    if (grade.startsWith('B')) return 'grade-B';
    if (grade.startsWith('C')) return 'grade-C';
    if (grade.startsWith('D')) return 'grade-D';
    if (grade === 'E') return 'grade-E';
    return '';
  }

  function standing(gpa) {
    if (gpa === null) return null;
    if (gpa >= 3.5) return { label: 'Dean\'s List', color: '#22c55e', bg: 'rgba(34,197,94,0.12)', border: 'rgba(34,197,94,0.35)' };
    if (gpa >= 3.0) return { label: 'Good Standing', color: '#60a5fa', bg: 'rgba(96,165,250,0.12)', border: 'rgba(96,165,250,0.35)' };
    if (gpa >= 2.0) return { label: 'Satisfactory', color: '#fbbf24', bg: 'rgba(251,191,36,0.12)', border: 'rgba(251,191,36,0.35)' };
    return { label: 'Below 2.0', color: '#f87171', bg: 'rgba(248,113,113,0.12)', border: 'rgba(248,113,113,0.35)' };
  }

  // Data
  let data = { semesters: [] };

  function load() {
    try { data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { semesters: [] }; }
    catch { data = { semesters: [] }; }
    if (!data.semesters) data.semesters = [];
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function calcGPA(courses) {
    const graded = courses.filter(c => c.grade && c.credits > 0);
    if (!graded.length) return null;
    const totalPoints = graded.reduce((s, c) => s + GRADE_MAP[c.grade] * c.credits, 0);
    const totalCredits = graded.reduce((s, c) => s + c.credits, 0);
    return totalCredits ? totalPoints / totalCredits : null;
  }

  function fmt(gpa) {
    return gpa === null ? '—' : gpa.toFixed(3);
  }

  function fmtShort(gpa) {
    return gpa === null ? '—' : gpa.toFixed(2);
  }

  function addSemester() {
    const inp = document.getElementById('new-sem-name');
    const name = inp.value.trim() || `Semester ${data.semesters.length + 1}`;
    data.semesters.push({ id: Date.now().toString(), name, courses: [] });
    inp.value = '';
    save();
    render();
  }

  function deleteSemester(semId) {
    data.semesters = data.semesters.filter(s => s.id !== semId);
    save();
    render();
  }

  function addCourse(semId) {
    const sem = data.semesters.find(s => s.id === semId);
    if (!sem) return;
    const nameEl = document.getElementById(`name-${semId}`);
    const credEl = document.getElementById(`cred-${semId}`);
    const gradeEl = document.getElementById(`grade-${semId}`);
    const name = nameEl.value.trim();
    const credits = parseFloat(credEl.value);
    const grade = gradeEl.value;
    if (!name) { nameEl.focus(); flash(nameEl); return; }
    if (!credits || credits <= 0) { credEl.focus(); flash(credEl); return; }
    sem.courses.push({ id: Date.now().toString(), name, credits, grade });
    nameEl.value = '';
    credEl.value = '';
    gradeEl.value = 'A';
    save();
    render();
    setTimeout(() => nameEl.focus(), 0);
  }

  function removeCourse(semId, courseId) {
    const sem = data.semesters.find(s => s.id === semId);
    if (!sem) return;
    sem.courses = sem.courses.filter(c => c.id !== courseId);
    save();
    render();
  }

  function flash(el) {
    el.style.borderColor = '#f87171';
    setTimeout(() => el.style.borderColor = '', 1200);
  }

  function renderScale() {
    const grid = document.getElementById('scale-grid');
    grid.innerHTML = GRADE_POINTS.map(g => {
      const cls = gradeColor(g.grade);
      return `<div class="scale-item">
        <span class="scale-letter ${cls}">${g.grade}</span>
        <span class="scale-points">${g.points.toFixed(1)}</span>
      </div>`;
    }).join('');
  }

  function toggleScale() {
    const body = document.getElementById('scale-body');
    const arrow = document.getElementById('scale-arrow');
    const visible = body.style.display !== 'none';
    body.style.display = visible ? 'none' : 'block';
    arrow.textContent = visible ? '▼' : '▲';
  }

  function gradeOptions(selected) {
    return GRADE_POINTS.map(g =>
      `<option value="${g.grade}" ${g.grade === selected ? 'selected' : ''}>${g.grade} (${g.points.toFixed(1)})</option>`
    ).join('');
  }

  function render() {
    renderSummary();
    renderSemesters();
  }

  function renderSummary() {
    const allCourses = data.semesters.flatMap(s => s.courses);
    const graded = allCourses.filter(c => c.grade && c.credits > 0);
    const totalCredits = graded.reduce((s, c) => s + c.credits, 0);
    const gpa = calcGPA(allCourses);

    document.getElementById('sum-credits').textContent = totalCredits || 0;
    document.getElementById('sum-courses').textContent = allCourses.length;
    document.getElementById('sum-gpa').textContent = fmt(gpa);

    const standEl = document.getElementById('sum-standing');
    const s = standing(gpa);
    if (s) {
      standEl.innerHTML = `<span class="gpa-badge" style="background:${s.bg};color:${s.color};border:1px solid ${s.border}">${s.label}</span>`;
    } else {
      standEl.innerHTML = '';
    }
  }

  function renderSemesters() {
    const container = document.getElementById('semesters-container');
    if (!data.semesters.length) {
      container.innerHTML = `<div style="text-align:center;padding:32px 0 8px;color:var(--text-muted);font-size:0.9rem;">No semesters yet — add one below to get started.</div>`;
      return;
    }

    container.innerHTML = data.semesters.map(sem => {
      const semGPA = calcGPA(sem.courses);
      const semCredits = sem.courses.filter(c => c.grade && c.credits > 0).reduce((s,c) => s+c.credits, 0);

      const courseRows = sem.courses.length
        ? sem.courses.map(c => {
            const cls = gradeColor(c.grade);
            return `<div class="course-row">
              <span style="font-size:0.9rem;">${esc(c.name)}</span>
              <span style="text-align:center;font-size:0.9rem;">${c.credits}</span>
              <span class="grade-select ${cls}" style="text-align:center;font-size:0.9rem;font-weight:700;">${c.grade || '—'}</span>
              <button class="btn-icon" onclick="removeCourse('${sem.id}','${c.id}')" title="Remove">×</button>
            </div>`;
          }).join('')
        : `<div class="empty-courses">No courses yet — add one below.</div>`;

      const headerRow = sem.courses.length
        ? `<div class="course-row header-row">
            <span>Course</span>
            <span style="text-align:center">Credits</span>
            <span style="text-align:center">Grade</span>
            <span></span>
          </div>`
        : '';

      return `
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">
              ${esc(sem.name)}
              ${semGPA !== null ? `<span class="semester-gpa-badge">GPA ${fmtShort(semGPA)} · ${semCredits} cr</span>` : ''}
            </div>
            <div class="semester-actions">
              <button class="btn-del-semester" onclick="deleteSemester('${sem.id}')">Remove Semester</button>
            </div>
          </div>
          <div class="panel-body">
            <div class="course-list">
              ${headerRow}
              ${courseRows}
            </div>
            <div class="add-row">
              <input id="name-${sem.id}" type="text" placeholder="Course name" maxlength="60"
                onkeydown="if(event.key==='Enter')addCourse('${sem.id}')" />
              <input id="cred-${sem.id}" type="number" min="0.5" max="20" step="0.5" placeholder="Cr"
                class="credits-input" style="max-width:64px"
                onkeydown="if(event.key==='Enter')addCourse('${sem.id}')" />
              <select id="grade-${sem.id}" class="grade-select" style="max-width:120px">
                ${gradeOptions('A')}
              </select>
              <button class="btn btn-primary" onclick="addCourse('${sem.id}')">Add</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Enter on semester name input
  document.getElementById('new-sem-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') addSemester();
  });

  renderScale();
  load();
  render();
</script>
</body>
</html>
