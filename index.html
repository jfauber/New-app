<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3352;
      --accent: #6c63ff;
      --accent-hover: #5a52e0;
      --text: #e2e8f0;
      --text-muted: #8892a4;
      --high: #f87171;
      --medium: #fbbf24;
      --low: #34d399;
      --overdue: #ff4f4f;
      --soon: #f97316;
      --complete: #22c55e;
      --radius: 10px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px;
    }

    header {
      max-width: 820px;
      margin: 0 auto 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header h1 span { color: var(--accent); }

    .stats {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 16px;
      text-align: center;
      min-width: 70px;
    }

    .stat .num { font-size: 1.4rem; font-weight: 700; }
    .stat .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat.overdue .num { color: var(--overdue); }
    .stat.upcoming .num { color: var(--accent); }
    .stat.done .num { color: var(--complete); }

    main { max-width: 820px; margin: 0 auto; }

    /* Add form */
    .add-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
    }

    .add-panel h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-grid .full { grid-column: 1 / -1; }

    input, select, textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    input::placeholder, textarea::placeholder { color: var(--text-muted); }

    select option { background: var(--surface2); }

    textarea { resize: vertical; min-height: 60px; }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-family: inherit;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-sm {
      padding: 5px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
    }

    .btn-danger { background: #3a1a1a; color: var(--high); border: 1px solid #5a2a2a; }
    .btn-danger:hover { background: #4a2020; }

    .btn-success { background: #1a3a25; color: var(--complete); border: 1px solid #2a5a35; }
    .btn-success:hover { background: #204530; }

    .btn-undo { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
    .btn-undo:hover { color: var(--text); }

    /* Controls bar */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-tabs {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .filter-tab {
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-muted);
      background: transparent;
      border: none;
      transition: background 0.2s, color 0.2s;
      font-family: inherit;
    }

    .filter-tab.active {
      background: var(--accent);
      color: #fff;
    }

    .sort-select {
      width: auto;
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    .search-input {
      flex: 1;
      min-width: 160px;
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    /* Assignment list */
    .assignments { display: flex; flex-direction: column; gap: 10px; }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty p { font-size: 1rem; }

    /* Assignment card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      transition: border-color 0.2s, opacity 0.2s;
      position: relative;
    }

    .card:hover { border-color: #3e4470; }

    .card.done {
      opacity: 0.55;
    }

    .card.done .title { text-decoration: line-through; color: var(--text-muted); }

    .card-left { display: flex; flex-direction: column; align-items: center; gap: 6px; }

    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .checkbox:hover { border-color: var(--complete); }
    .checkbox.checked { background: var(--complete); border-color: var(--complete); }
    .checkbox.checked::after { content: '✓'; color: #fff; font-size: 13px; font-weight: 700; }

    .priority-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 2px;
    }

    .priority-high { background: var(--high); }
    .priority-medium { background: var(--medium); }
    .priority-low { background: var(--low); }

    .card-body { flex: 1; min-width: 0; }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .card-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .tag-course {
      background: rgba(108, 99, 255, 0.15);
      color: #a89dff;
      border: 1px solid rgba(108, 99, 255, 0.3);
    }

    .tag-overdue {
      background: rgba(248, 113, 113, 0.15);
      color: var(--high);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    .tag-soon {
      background: rgba(249, 115, 22, 0.15);
      color: var(--soon);
      border: 1px solid rgba(249, 115, 22, 0.3);
    }

    .tag-future {
      background: rgba(52, 211, 153, 0.1);
      color: var(--low);
      border: 1px solid rgba(52, 211, 153, 0.2);
    }

    .tag-done {
      background: rgba(34, 197, 94, 0.1);
      color: var(--complete);
      border: 1px solid rgba(34, 197, 94, 0.2);
    }

    .notes {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    /* Priority label in form */
    .priority-option-high { color: var(--high); }
    .priority-option-medium { color: var(--medium); }
    .priority-option-low { color: var(--low); }

    @media (max-width: 540px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .full { grid-column: 1; }
      header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>Assignment <span>Tracker</span></h1>
  <div class="stats">
    <div class="stat overdue">
      <div class="num" id="stat-overdue">0</div>
      <div class="label">Overdue</div>
    </div>
    <div class="stat upcoming">
      <div class="num" id="stat-upcoming">0</div>
      <div class="label">Upcoming</div>
    </div>
    <div class="stat done">
      <div class="num" id="stat-done">0</div>
      <div class="label">Done</div>
    </div>
  </div>
</header>

<main>
  <!-- Add Assignment Form -->
  <div class="add-panel">
    <h2>Add Assignment</h2>
    <div class="form-grid">
      <input class="full" type="text" id="inp-title" placeholder="Assignment title *" />
      <input type="text" id="inp-course" placeholder="Course / Subject" />
      <input type="date" id="inp-due" />
      <select id="inp-priority">
        <option value="high">🔴 High priority</option>
        <option value="medium" selected>🟡 Medium priority</option>
        <option value="low">🟢 Low priority</option>
      </select>
      <select id="inp-type">
        <option value="Homework">Homework</option>
        <option value="Essay">Essay</option>
        <option value="Project">Project</option>
        <option value="Quiz">Quiz</option>
        <option value="Exam">Exam</option>
        <option value="Lab">Lab</option>
        <option value="Reading">Reading</option>
        <option value="Other">Other</option>
      </select>
      <textarea class="full" id="inp-notes" placeholder="Notes (optional)"></textarea>
      <div class="full" style="display:flex;justify-content:flex-end;">
        <button class="btn btn-primary" onclick="addAssignment()">+ Add Assignment</button>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="upcoming" onclick="setFilter('upcoming')">Upcoming</button>
      <button class="filter-tab" data-filter="all" onclick="setFilter('all')">All</button>
      <button class="filter-tab" data-filter="overdue" onclick="setFilter('overdue')">Overdue</button>
      <button class="filter-tab" data-filter="done" onclick="setFilter('done')">Done</button>
    </div>
    <input class="search-input" type="text" id="search" placeholder="Search..." oninput="render()" />
    <select class="sort-select" id="sort" onchange="render()">
      <option value="due">Sort: Due Date</option>
      <option value="priority">Sort: Priority</option>
      <option value="course">Sort: Course</option>
      <option value="added">Sort: Recently Added</option>
    </select>
  </div>

  <!-- Assignment List -->
  <div class="assignments" id="list"></div>
</main>

<script>
  const STORAGE_KEY = 'assignments_v1';
  let assignments = [];
  let currentFilter = 'upcoming';

  function load() {
    try {
      assignments = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch { assignments = []; }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(assignments));
  }

  function today() {
    return new Date().toISOString().split('T')[0];
  }

  function daysDiff(due) {
    if (!due) return null;
    const now = new Date(); now.setHours(0,0,0,0);
    const d = new Date(due + 'T00:00:00');
    return Math.round((d - now) / 86400000);
  }

  function dueLabelTag(due, done) {
    if (done) return `<span class="tag tag-done">Completed</span>`;
    const diff = daysDiff(due);
    if (diff === null) return '';
    if (diff < 0) return `<span class="tag tag-overdue">Overdue by ${Math.abs(diff)}d</span>`;
    if (diff === 0) return `<span class="tag tag-overdue">Due Today</span>`;
    if (diff === 1) return `<span class="tag tag-soon">Due Tomorrow</span>`;
    if (diff <= 3) return `<span class="tag tag-soon">Due in ${diff} days</span>`;
    return `<span class="tag tag-future">Due in ${diff} days</span>`;
  }

  function formatDate(due) {
    if (!due) return '';
    const d = new Date(due + 'T00:00:00');
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function priorityOrder(p) { return { high: 0, medium: 1, low: 2 }[p] ?? 1; }

  function addAssignment() {
    const title = document.getElementById('inp-title').value.trim();
    if (!title) {
      document.getElementById('inp-title').focus();
      document.getElementById('inp-title').style.borderColor = 'var(--high)';
      setTimeout(() => document.getElementById('inp-title').style.borderColor = '', 1200);
      return;
    }
    const a = {
      id: Date.now().toString(),
      title,
      course: document.getElementById('inp-course').value.trim(),
      due: document.getElementById('inp-due').value,
      priority: document.getElementById('inp-priority').value,
      type: document.getElementById('inp-type').value,
      notes: document.getElementById('inp-notes').value.trim(),
      done: false,
      added: Date.now(),
    };
    assignments.unshift(a);
    save();
    render();
    // Clear form
    document.getElementById('inp-title').value = '';
    document.getElementById('inp-course').value = '';
    document.getElementById('inp-due').value = '';
    document.getElementById('inp-priority').value = 'medium';
    document.getElementById('inp-type').value = 'Homework';
    document.getElementById('inp-notes').value = '';
  }

  function toggle(id) {
    const a = assignments.find(x => x.id === id);
    if (a) { a.done = !a.done; save(); render(); }
  }

  function remove(id) {
    assignments = assignments.filter(x => x.id !== id);
    save(); render();
  }

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.filter === f);
    });
    render();
  }

  function filtered() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const t = today();
    return assignments.filter(a => {
      if (q && !a.title.toLowerCase().includes(q) && !a.course.toLowerCase().includes(q)) return false;
      if (currentFilter === 'upcoming') return !a.done;
      if (currentFilter === 'overdue') return !a.done && a.due && a.due < t;
      if (currentFilter === 'done') return a.done;
      return true;
    });
  }

  function sorted(arr) {
    const s = document.getElementById('sort').value;
    return [...arr].sort((a, b) => {
      if (s === 'due') {
        if (!a.due && !b.due) return 0;
        if (!a.due) return 1;
        if (!b.due) return -1;
        return a.due.localeCompare(b.due);
      }
      if (s === 'priority') return priorityOrder(a.priority) - priorityOrder(b.priority);
      if (s === 'course') return a.course.localeCompare(b.course);
      return b.added - a.added;
    });
  }

  function updateStats() {
    const t = today();
    document.getElementById('stat-overdue').textContent =
      assignments.filter(a => !a.done && a.due && a.due < t).length;
    document.getElementById('stat-upcoming').textContent =
      assignments.filter(a => !a.done).length;
    document.getElementById('stat-done').textContent =
      assignments.filter(a => a.done).length;
  }

  function render() {
    updateStats();
    const list = document.getElementById('list');
    const items = sorted(filtered());

    if (!items.length) {
      const msgs = {
        upcoming: ['📚', 'No upcoming assignments!', 'Add one above to get started.'],
        overdue: ['✅', 'No overdue assignments!', "You're all caught up."],
        done: ['🎉', 'No completed assignments yet.', 'Complete an assignment to see it here.'],
        all: ['📋', 'No assignments yet.', 'Add one above to get started.'],
      };
      const [icon, h, sub] = msgs[currentFilter] || msgs.all;
      list.innerHTML = `<div class="empty"><div class="empty-icon">${icon}</div><p><strong>${h}</strong></p><p style="font-size:0.85rem;margin-top:6px;">${sub}</p></div>`;
      return;
    }

    list.innerHTML = items.map(a => {
      const checked = a.done ? 'checked' : '';
      const cardClass = a.done ? 'card done' : 'card';
      const pClass = `priority-${a.priority}`;
      return `
        <div class="${cardClass}" id="card-${a.id}">
          <div class="card-left">
            <div class="checkbox ${a.done ? 'checked' : ''}" onclick="toggle('${a.id}')" title="${a.done ? 'Mark incomplete' : 'Mark complete'}"></div>
            <div class="priority-dot ${pClass}" title="${a.priority} priority"></div>
          </div>
          <div class="card-body">
            <div class="card-top">
              <div class="title">${esc(a.title)}</div>
              <div class="card-actions">
                <button class="btn btn-sm ${a.done ? 'btn-undo' : 'btn-success'}" onclick="toggle('${a.id}')">
                  ${a.done ? 'Undo' : 'Done'}
                </button>
                <button class="btn btn-sm btn-danger" onclick="remove('${a.id}')">Delete</button>
              </div>
            </div>
            <div class="meta">
              ${a.course ? `<span class="tag tag-course">${esc(a.course)}</span>` : ''}
              <span style="opacity:0.7">${a.type}</span>
              ${a.due ? `<span>📅 ${formatDate(a.due)}</span>` : '<span style="opacity:0.5">No due date</span>'}
              ${dueLabelTag(a.due, a.done)}
            </div>
            ${a.notes ? `<div class="notes">${esc(a.notes)}</div>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Set default due date to today
  document.getElementById('inp-due').value = today();

  // Enter to submit form
  document.getElementById('inp-title').addEventListener('keydown', e => {
    if (e.key === 'Enter') addAssignment();
  });

  load();
  render();
</script>
</body>
</html>
